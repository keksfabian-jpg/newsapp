name: Build APK

on:
  push:
    branches: [main]
    paths-ignore: ['.github/workflows/probe.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build
        run: gradle :app:testReleaseUnitTest :app:assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk NewsTrader.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NewsTrader-apk
          path: NewsTrader.apk

      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" NewsTrader.apk \
            --title "NewsTrader 1.0.${{ github.run_number }}" \
            --notes "Automatischer Build. APK auf dem Handy öffnen und installieren." \
            --latest
